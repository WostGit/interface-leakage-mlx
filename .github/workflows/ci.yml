name: ci

on:
  push:
  pull_request:

jobs:
  experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run all experiments
        run: bash ci/run_ci.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: interface-leakage-results
          path: |
            artifacts/*.csv
            artifacts/*.png
