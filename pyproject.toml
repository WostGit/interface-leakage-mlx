[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interface-leakage-mlx"
version = "0.1.0"
description = "Minimal reproducible experiments for model extraction under different API interfaces"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "matplotlib>=3.8",
]

[tool.setuptools]
py-modules = ["run_all"]
packages = ["models", "attacks", "experiments", "ci"]
